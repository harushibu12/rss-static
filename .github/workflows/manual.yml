name: RSS更新

on:
  schedule:
    # 毎時17分（日本時間）
    - cron: '17 * * * *'

  # 手動実行
  workflow_dispatch:

# RSS更新Actionsが同時に走るのを防ぐ
concurrency:
  group: rss-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ===== リポジトリ取得 =====
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== RSS取得・JSON更新 =====
      - name: Pythonを実行
        run: |
          python update.py

      # ===== JSONをコミット・Push =====
      - name: JSONをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 今回生成したRSS JSONを一時保存
          cp rss-data.json /tmp/rss-data.json

          # GitHub側の最新mainを取得
          git fetch origin main

          # GitHub側の最新mainに完全に合わせる
          git reset --hard origin/main

          # 今回生成したRSS JSONを戻す
          cp /tmp/rss-data.json rss-data.json

          # RSS JSONだけをコミット
          git add rss-data.json

          # 変更がなければ終了
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
            exit 0
          fi

          # コミット
          git commit -m "RSSを更新"

          # 最新のmainへPush
          git push origin HEAD:main
